<text class="mts" x="432" y="238">по ним циркулируют инфоны</text>
<text class="mth" x="400" y="278">Правило движения</text>
<text class="mts" x="400" y="298">не через центр (пробка / коллапс)</text>
<text class="mts" x="400" y="316">не за внешнюю границу (вылет)</text>
<text class="mts" x="230" y="388" text-anchor="middle">Шри Янтра — альтернативная топология (вложенные треугольники, бинду в центре)</text>
