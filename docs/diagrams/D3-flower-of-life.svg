<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Цветок жизни: решётка маршрутов</title>
<desc>Решётка «Цветок жизни» из девятнадцати окружностей; узлы-пересечения служат станциями, дуги — маршрутами, движение идёт по периметру, не через центр.</desc>
