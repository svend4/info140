<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Реакции: дробление и слияние</title>
<desc>Лестница классов инфонов от C0 до C5; верхняя дуга — слияние при лямбда к единице, нижняя дуга — дробление при лямбда к нулю, с сохранением массы и заряда.</desc>
<style>
text{font-family:'Anthropic Sans',system-ui,'Segoe UI',Roboto,sans-serif}
.mt{font-size:14px;fill:#2C2C2A}.mts{font-size:12px;fill:#5F5E5A}.mth{font-size:14px;font-weight:500;fill:#2C2C2A}.mttl{font-size:16px;font-weight:500;fill:#2C2C2A}
.box-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1.5}.tx-purple{fill:#26215C}.txs-purple{fill:#3C3489}
.box-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.5}.tx-teal{fill:#04342C}.txs-teal{fill:#085041}
.box-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1.5}.tx-coral{fill:#4A1B0C}.txs-coral{fill:#712B13}
.box-blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}.tx-blue{fill:#042C53}.txs-blue{fill:#0C447C}
.box-amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:1.5}.tx-amber{fill:#412402}.txs-amber{fill:#633806}
.box-green{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1.5}.tx-green{fill:#173404}.txs-green{fill:#27500A}
@media (prefers-color-scheme:dark){
.mt{fill:#E8E8EA}.mts{fill:#B4B2A9}.mth{fill:#E8E8EA}.mttl{fill:#F1EFE8}
.box-purple{fill:#3C3489;stroke:#AFA9EC}.tx-purple{fill:#CECBF6}.txs-purple{fill:#AFA9EC}
.box-teal{fill:#085041;stroke:#5DCAA5}.tx-teal{fill:#9FE1CB}.txs-teal{fill:#5DCAA5}
.box-coral{fill:#712B13;stroke:#F0997B}.tx-coral{fill:#F5C4B3}.txs-coral{fill:#F0997B}
.box-blue{fill:#0C447C;stroke:#85B7EB}.tx-blue{fill:#B5D4F4}.txs-blue{fill:#85B7EB}
.box-amber{fill:#633806;stroke:#EF9F27}.tx-amber{fill:#FAC775}.txs-amber{fill:#EF9F27}
.box-green{fill:#27500A;stroke:#97C459}.tx-green{fill:#C0DD97}.txs-green{fill:#97C459}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="mttl" x="40" y="30">Реакции: дробление ↔ слияние</text>
<text class="mts" x="40" y="50">рычаг λ смещает баланс распад/синтез; масса и заряд сохраняются</text>
<path d="M80 150 C 230 95, 450 95, 600 150" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<text class="mth" x="340" y="90" text-anchor="middle">слияние ▲ (λ→1): класс растёт, масса суммируется</text>
<path d="M600 200 C 450 270, 230 270, 80 200" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
<text class="mth" x="340" y="300" text-anchor="middle">дробление ▼ (λ→0): класс падает, масса делится</text>
<rect class="box-coral" x="40" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-coral" x="80" y="172" text-anchor="middle">C0</text>
<text class="mts txs-coral" x="80" y="190" text-anchor="middle">буквы</text>
<rect class="box-amber" x="144" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-amber" x="184" y="172" text-anchor="middle">C1</text>
<text class="mts txs-amber" x="184" y="190" text-anchor="middle">слова</text>
<rect class="box-green" x="248" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-green" x="288" y="172" text-anchor="middle">C2</text>
<text class="mts txs-green" x="288" y="190" text-anchor="middle">фразы</text>
<rect class="box-teal" x="352" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-teal" x="392" y="172" text-anchor="middle">C3</text>
<text class="mts txs-teal" x="392" y="190" text-anchor="middle">статьи</text>
<rect class="box-blue" x="456" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-blue" x="496" y="172" text-anchor="middle">C4</text>
<text class="mts txs-blue" x="496" y="190" text-anchor="middle">порталы</text>
<rect class="box-purple" x="560" y="150" width="80" height="50" rx="8"/>
<text class="mth tx-purple" x="600" y="172" text-anchor="middle">C5</text>
<text class="mts txs-purple" x="600" y="190" text-anchor="middle">ядро</text>
<text class="mts" x="340" y="327" text-anchor="middle">тормоза не дают дойти до полюсов: ни «всё в пыль», ни «всё в одно ядро»</text>
</svg>
