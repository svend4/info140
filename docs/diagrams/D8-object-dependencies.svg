<svg width="100%" viewBox="0 0 680 425" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Граф зависимостей объектов</title>
<desc>Структуры данных движка: World владеет Lever, Scheduler, Infon и геометрией; пунктирные стрелки показывают ссылки между Scheduler, Infon, Lane, Route, Orbit, Edge, Node.</desc>
<style>
text{font-family:'Anthropic Sans',system-ui,'Segoe UI',Roboto,sans-serif}
.mt{font-size:14px;fill:#2C2C2A}.mts{font-size:12px;fill:#5F5E5A}.mth{font-size:14px;font-weight:500;fill:#2C2C2A}.mttl{font-size:16px;font-weight:500;fill:#2C2C2A}
.box-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1.5}.tx-purple{fill:#26215C}.txs-purple{fill:#3C3489}
.box-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.5}.tx-teal{fill:#04342C}.txs-teal{fill:#085041}
.box-blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}.tx-blue{fill:#042C53}.txs-blue{fill:#0C447C}
.box-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1.5}.tx-gray{fill:#2C2C2A}.txs-gray{fill:#444441}
.own{stroke:#888780;stroke-width:1.6;fill:none}.dep{stroke:#888780;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
@media (prefers-color-scheme:dark){
.mt{fill:#E8E8EA}.mts{fill:#B4B2A9}.mth{fill:#E8E8EA}.mttl{fill:#F1EFE8}
.box-purple{fill:#3C3489;stroke:#AFA9EC}.tx-purple{fill:#CECBF6}.txs-purple{fill:#AFA9EC}
.box-teal{fill:#085041;stroke:#5DCAA5}.tx-teal{fill:#9FE1CB}.txs-teal{fill:#5DCAA5}
.box-blue{fill:#0C447C;stroke:#85B7EB}.tx-blue{fill:#B5D4F4}.txs-blue{fill:#85B7EB}
.box-gray{fill:#2C2C2A;stroke:#888780}.tx-gray{fill:#D3D1C7}.txs-gray{fill:#B4B2A9}
.own{stroke:#B4B2A9}.dep{stroke:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="mttl" x="40" y="30">Граф зависимостей объектов (структуры данных)</text>
<text class="mts" x="40" y="50">сплошная — владение (World), пунктир — ссылки между структурами</text>
<line class="own" x1="340" y1="101" x2="138" y2="150" marker-end="url(#arrow)"/>
<line class="own" x1="340" y1="101" x2="340" y2="150" marker-end="url(#arrow)"/>
<line class="own" x1="340" y1="101" x2="548" y2="150" marker-end="url(#arrow)"/>
<line class="dep" x1="332" y1="196" x2="150" y2="250" marker-end="url(#arrow)"/>
<line class="dep" x1="550" y1="196" x2="550" y2="250" marker-end="url(#arrow)"/>
<line class="dep" x1="540" y1="196" x2="360" y2="250" marker-end="url(#arrow)"/>
<line class="dep" x1="330" y1="296" x2="255" y2="350" marker-end="url(#arrow)"/>
<line class="dep" x1="350" y1="296" x2="430" y2="350" marker-end="url(#arrow)"/>
<line class="dep" x1="130" y1="296" x2="225" y2="350" marker-end="url(#arrow)"/>
<line class="dep" x1="300" y1="373" x2="380" y2="373" marker-end="url(#arrow)"/>
<rect class="box-purple" x="280" y="55" width="120" height="46" rx="8"/>
<text class="mth tx-purple" x="340" y="78" text-anchor="middle">World</text>
<text class="mts txs-purple" x="340" y="94" text-anchor="middle">мир (корень)</text>
<rect class="box-purple" x="70" y="150" width="120" height="46" rx="8"/>
<text class="mth tx-purple" x="130" y="173" text-anchor="middle">Lever</text>
<text class="mts txs-purple" x="130" y="189" text-anchor="middle">рычаг λ</text>
<rect class="box-blue" x="280" y="150" width="120" height="46" rx="8"/>
<text class="mth tx-blue" x="340" y="173" text-anchor="middle">Scheduler</text>
<text class="mts txs-blue" x="340" y="189" text-anchor="middle">конвейер</text>
<rect class="box-teal" x="490" y="150" width="120" height="46" rx="8"/>
<text class="mth tx-teal" x="550" y="173" text-anchor="middle">Infon</text>
<text class="mts txs-teal" x="550" y="189" text-anchor="middle">частица</text>
<rect class="box-blue" x="70" y="250" width="120" height="46" rx="8"/>
<text class="mth tx-blue" x="130" y="273" text-anchor="middle">Lane</text>
<text class="mts txs-blue" x="130" y="289" text-anchor="middle">линия метро</text>
<rect class="box-teal" x="280" y="250" width="120" height="46" rx="8"/>
<text class="mth tx-teal" x="340" y="273" text-anchor="middle">Route</text>
<text class="mts txs-teal" x="340" y="289" text-anchor="middle">маршрут</text>
<rect class="box-gray" x="490" y="250" width="120" height="46" rx="8"/>
<text class="mth tx-gray" x="550" y="273" text-anchor="middle">Orbit</text>
<text class="mts txs-gray" x="550" y="289" text-anchor="middle">оболочка</text>
<rect class="box-gray" x="180" y="350" width="120" height="46" rx="8"/>
<text class="mth tx-gray" x="240" y="373" text-anchor="middle">Edge</text>
<text class="mts txs-gray" x="240" y="389" text-anchor="middle">ребро / линия</text>
<rect class="box-gray" x="380" y="350" width="120" height="46" rx="8"/>
<text class="mth tx-gray" x="440" y="373" text-anchor="middle">Node</text>
<text class="mts txs-gray" x="440" y="389" text-anchor="middle">узел / станция</text>
<line class="own" x1="528" y1="408" x2="558" y2="408" marker-end="url(#arrow)"/>
<text class="mts" x="566" y="412">владеет</text>
<line class="dep" x1="380" y1="408" x2="410" y2="408" marker-end="url(#arrow)"/>
<text class="mts" x="418" y="412">ссылается</text>
</svg>
