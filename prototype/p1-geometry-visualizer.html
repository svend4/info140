<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MERIDIAN — визуализатор геометрии (шаг 3.1)</title>
<style>
:root{--text-primary:#2C2C2A;--text-secondary:#5F5E5A;--text-muted:#888780;--surface-1:#F7F6F2;--border:#D3D1C7;--radius:8px;--font-sans:system-ui,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--text-primary:#E8E8EA;--text-secondary:#B4B2A9;--text-muted:#888780;--surface-1:#26262B;--border:#444441}}
html,body{margin:0;background:#FBFAF7}
@media (prefers-color-scheme:dark){html,body{background:#1A1A1C}}
body{padding:24px;display:flex;justify-content:center;font-family:var(--font-sans)}
.wrap{max-width:780px;width:100%;color:var(--text-primary)}
.h1{font-size:20px;font-weight:500;margin:0 0 2px}
.sub{font-size:13px;color:var(--text-secondary);margin-bottom:12px}
#mrd-canvas{display:block;width:100%;height:460px;border:1px solid var(--border);border-radius:12px}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:13px}
.ctl label{display:inline-flex;align-items:center;gap:6px}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:var(--radius);padding:6px 14px;font-size:13px}
.note{font-size:12px;color:var(--text-muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="h1">MERIDIAN — визуализатор геометрии (шаг 3.1)</div>
<div class="sub">инфоны кружат по орбитам с дифференциальным вращением; к центру — общие классы (C5), к краю — дробные (C0)</div>
<canvas id="mrd-canvas"></canvas>
<div class="ctl">
<button id="mrd-play" class="btn">⏸ пауза</button>
<button id="mrd-snd" class="btn">♪ звук</button>
<label>скорость <input id="mrd-speed" type="range" min="0" max="3" step="0.1" value="1"></label>
<label>инфонов <input id="mrd-count" type="range" min="12" max="300" step="6" value="120"> <span id="mrd-count-v">120</span></label>
<label><input id="mrd-orbits" type="checkbox" checked> орбиты</label>
<label><input id="mrd-flower" type="checkbox"> цветок жизни</label>
<label><input id="mrd-metro" type="checkbox" checked> метро</label>
<label><input id="mrd-diff" type="checkbox" checked> дифф. вращение</label>
</div>
<div class="note">Реакции дробления/слияния и живой рычаг λ — следующий шаг (3.2). Это шаг 3.1: только движение по гибридной геометрии.</div>
</div>
<script src="lib/mrd-fx.js"></script>
<script>
(function(){
  var cvs=document.getElementById('mrd-canvas');if(!cvs)return;
  var FX=window.MRDFX||{toggle:function(){return false;},ambient:function(){},freq:function(){},blip:function(){},chord:function(){},best:function(k,s){return s||0;}};
  var ctx=cvs.getContext('2d');var TAU=Math.PI*2;
  var RAMP=['#7F77DD','#378ADD','#1D9E75','#639922','#EF9F27','#D85A30'];
  var ORB=[0.16,0.30,0.44,0.58,0.72,0.86];
  var st={playing:true,speed:1,count:120,orbits:true,flower:false,metro:true,diff:true,alpha:1.5};
  var W=0,H=0,cx=0,cy=0,scale=0,infons=[];
  var FL=[[0,0]];
  (function(){var k,a;for(k=0;k<6;k++){a=k*Math.PI/3;FL.push([Math.cos(a),Math.sin(a)]);}
   for(k=0;k<6;k++){a=Math.PI/6+k*Math.PI/3;FL.push([Math.sqrt(3)*Math.cos(a),Math.sqrt(3)*Math.sin(a)]);}
   for(k=0;k<6;k++){a=k*Math.PI/3;FL.push([2*Math.cos(a),2*Math.sin(a)]);}})();
  function theme(){var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    return d?{faint:'#3A3A3C',bound:'#888780'}:{faint:'#E0DED7',bound:'#9A9A93'};}
  function resize(){var r=cvs.getBoundingClientRect();var dpr=window.devicePixelRatio||1;
    W=r.width||680;H=r.height||460;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2;cy=H/2;scale=Math.min(W,H)/2-14;}
  function rOf(i){return ORB[i]*scale;}
  function wOf(i){var r=ORB[i];if(!st.diff)return 0.010;return 0.0045*Math.pow(0.86/r,st.alpha);}
  function init(){infons=[];for(var i=0;i<st.count;i++){infons.push({o:i%6,a:Math.random()*TAU});}}
  function drawFlower(t){var rF=scale*0.17;ctx.save();ctx.globalAlpha=0.5;ctx.strokeStyle=t.faint;ctx.lineWidth=1;
    for(var i=0;i<FL.length;i++){ctx.beginPath();ctx.arc(cx+FL[i][0]*rF,cy+FL[i][1]*rF,rF,0,TAU);ctx.stroke();}ctx.restore();}
  function drawMetro(){var lines=[{o:1,c:'#378ADD',s:6},{o:3,c:'#D85A30',s:6}];ctx.save();ctx.lineWidth=3;
    for(var l=0;l<lines.length;l++){var L=lines[l],r=rOf(L.o);ctx.strokeStyle=L.c;ctx.globalAlpha=0.5;
      ctx.beginPath();ctx.arc(cx,cy,r,-0.2,Math.PI+0.6);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=L.c;
      for(var s=0;s<L.s;s++){var ang=-0.2+(Math.PI+0.8)*s/(L.s-1);ctx.beginPath();ctx.arc(cx+r*Math.cos(ang),cy+r*Math.sin(ang),4,0,TAU);ctx.fill();}}ctx.restore();}
  function draw(){var t=theme();ctx.clearRect(0,0,W,H);
    ctx.save();ctx.strokeStyle=t.bound;ctx.setLineDash([5,5]);ctx.globalAlpha=0.7;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,scale*0.96,0,TAU);ctx.stroke();ctx.restore();
    if(st.flower)drawFlower(t);
    if(st.orbits){ctx.save();ctx.lineWidth=1.5;for(var i=0;i<6;i++){ctx.strokeStyle=RAMP[i];ctx.globalAlpha=0.55;ctx.beginPath();ctx.arc(cx,cy,rOf(i),0,TAU);ctx.stroke();}ctx.restore();}
    if(st.metro)drawMetro();
    ctx.fillStyle=RAMP[0];ctx.beginPath();ctx.arc(cx,cy,5,0,TAU);ctx.fill();
    for(var k=0;k<infons.length;k++){var inf=infons[k],r=rOf(inf.o);var x=cx+r*Math.cos(inf.a),y=cy+r*Math.sin(inf.a);
      ctx.fillStyle=RAMP[inf.o];ctx.beginPath();ctx.arc(x,y,3.2,0,TAU);ctx.fill();}}
  function stepSim(){if(!st.playing)return;for(var k=0;k<infons.length;k++){infons[k].a+=wOf(infons[k].o)*st.speed;}}
  function loop(){stepSim();draw();FX.ambient(0.015);requestAnimationFrame(loop);}
  function $(id){return document.getElementById(id);}
  var pb=$('mrd-play');if(pb)pb.onclick=function(){st.playing=!st.playing;pb.textContent=st.playing?'⏸ пауза':'▶ играть';};
  var _sb=$('mrd-snd');if(_sb)_sb.onclick=function(){var on=FX.toggle();_sb.textContent=on?'♪ звук вкл':'♪ звук';};
  var sp=$('mrd-speed');if(sp)sp.oninput=function(){st.speed=parseFloat(sp.value);};
  var cn=$('mrd-count');if(cn)cn.oninput=function(){st.count=parseInt(cn.value,10);var v=$('mrd-count-v');if(v)v.textContent=cn.value;init();};
  var co=$('mrd-orbits');if(co)co.onchange=function(){st.orbits=co.checked;};
  var cf=$('mrd-flower');if(cf)cf.onchange=function(){st.flower=cf.checked;};
  var cm=$('mrd-metro');if(cm)cm.onchange=function(){st.metro=cm.checked;};
  var cd=$('mrd-diff');if(cd)cd.onchange=function(){st.diff=cd.checked;};
  window.addEventListener('resize',resize);
  resize();init();loop();
})();
</script>
</body>
</html>
